# H01-140 reference only. Do not enable as part of this spike.
# Legacy localhost:8876 remains untouched and is intentionally NOT proxied here.
server {
    listen 8443 ssl;
    server_name founder-console.invalid;

    # TLS directives are deployment-owned and intentionally omitted from the spike.

    location / {
        # Strip 9router-internal locality/trust headers at the edge.
        proxy_set_header X-9r-Real-Ip "";
        proxy_set_header X-9r-Peer-Token "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:20128;
    }
}
