<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIE Founder Console — H01-140</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0b0d10;color:#eef1f5}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:#0b0d10}.side{border-right:1px solid #252a31;padding:20px 14px;background:#101318}.brand{padding:8px 10px 20px;font-weight:800;letter-spacing:.02em}.brand small{display:block;color:#8f98a6;font-weight:500;margin-top:4px}.nav button{width:100%;border:0;background:transparent;color:#aeb7c4;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#1d232b;color:#fff}.main{padding:26px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.badge{border:1px solid #33404d;border-radius:999px;padding:7px 10px;color:#c5ced8;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid #252a31;background:#11151a;border-radius:12px;padding:18px}.card h3{margin:0 0 9px;font-size:14px}.metric{font-size:26px;font-weight:750}.muted{color:#8f98a6;font-size:13px;line-height:1.5}.ok{color:#82d9a0}.warn{color:#ffcf70}.table{margin-top:16px;border:1px solid #252a31;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;padding:12px 14px;border-top:1px solid #252a31;font-size:13px}.row:first-child{border-top:0;background:#151a20;color:#8f98a6}.notice{margin-top:16px;padding:12px 14px;border:1px solid #504525;background:#1b1810;border-radius:10px;color:#e5c97b;font-size:13px}@media(max-width:900px){body{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.main{padding:18px}}
</style>
</head>
<body>
<aside class="side"><div class="brand">DIE Founder Console<small>9router UI-shell architecture spike</small></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="top"><div><h1 id="title" style="margin:0 0 5px">Overview</h1><div class="muted">BODY: Founder Console · BRAIN: Mission Control</div></div><div class="badge">READ ONLY · H01-140</div></div><section class="grid" id="cards"></section><section class="table" id="table"></section><div class="notice">Spike invariant: no provider login/BYOK mutation, no marketplace action, no publication authority, no H01-108 mutation, and localhost:8876 remains live.</div></main>
<script>
const pages=[['Overview','overview'],['Production','production'],['Providers/BYOK','providers'],['QC Gallery','qc/gallery'],['Submission Ready','submission-ready'],['Demand Intelligence','demand'],['Tasks/MC','tasks'],['System Health','system/health'],['Settings','settings']];
const nav=document.querySelector('#nav'),title=document.querySelector('#title'),cards=document.querySelector('#cards'),table=document.querySelector('#table');
for(const [label,path] of pages){const b=document.createElement('button');b.textContent=label;b.onclick=()=>load(label,path,b);nav.appendChild(b)}
function renderData(data){const entries=Object.entries(data||{});cards.innerHTML=entries.slice(0,6).map(([k,v])=>`<article class="card"><h3>${k.replaceAll('_',' ')}</h3><div class="${String(v).includes('PASS')?'ok':''} metric">${typeof v==='object'?'●':String(v)}</div><div class="muted">Canonical read model</div></article>`).join('');table.innerHTML='<div class="row"><div>Field</div><div>Value</div><div>Authority</div><div>Mutation</div></div>'+entries.map(([k,v])=>`<div class="row"><div>${k}</div><div>${typeof v==='object'?JSON.stringify(v):v}</div><div>external/canonical</div><div>NONE</div></div>`).join('')}
async function load(label,path,button){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));button.classList.add('active');title.textContent=label;cards.innerHTML='<article class="card"><div class="muted">Loading canonical read model…</div></article>';table.innerHTML='';try{const r=await fetch('/api/die/v1/'+path);const j=await r.json();renderData(j.data)}catch(e){cards.innerHTML='<article class="card"><h3>Adapter</h3><div class="warn">UNAVAILABLE</div><div class="muted">'+e.message+'</div></article>'}}
load(...pages[0],nav.querySelector('button'));
</script>
</body></html>
