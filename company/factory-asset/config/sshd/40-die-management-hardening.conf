# FA-310 governed management ingress hardening.
# Public NAT port is upstream infrastructure; guest sshd remains on port 22.
# Recovery topology has no independent provider/OOB console: retain kopiko password as break-glass.
PermitRootLogin no
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers kopiko
MaxAuthTries 6
LoginGraceTime 60
MaxStartups 10:30:30
ClientAliveInterval 60
ClientAliveCountMax 3
