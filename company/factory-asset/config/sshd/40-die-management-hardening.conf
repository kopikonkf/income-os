# FA-310 governed management ingress hardening.
# Public NAT port is upstream infrastructure; guest sshd remains on port 22.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers kopiko
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:30
ClientAliveInterval 60
ClientAliveCountMax 3
